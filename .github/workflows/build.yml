name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build Web and Mobile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run check

      - name: Build Astro
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Tests
        run: |
          npm install -g wait-on
          node tests/preview.mjs &
          wait-on http://127.0.0.1:4322 -t 15000 || sleep 5
          npx firebase-tools emulators:exec --only firestore 'npm run test:ui && npm run test:pdf && npm run test:orders'

      - name: Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Build Android APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nalaro-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
