name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build Web and Mobile
    runs-on: ubuntu-latest
    env:
      PUBLIC_NATIVE_APP: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Order Contract
        run: node --experimental-strip-types tests/order-parity.test.mjs

      - name: Setup Browser Test
        run: npx playwright install --with-deps chromium

      - name: Firebase Emulator Dummy Order Test
        run: npx firebase emulators:exec --only firestore --project demo-nalaro-orders "node --experimental-strip-types tests/orders.test.mjs"

      - name: Validate Notify Worker Syntax
        run: node --check workers/notify/src/worker.js

      - name: Test Native Mail and Push Endpoints
        run: node tests/native-mail-push.test.mjs

      - name: Test Mailbox MIME and Attachment Storage
        run: |
          npm run build:mailbox
          npm run test:mailbox

      - name: Package Mailbox Worker for Manual Deployment
        uses: actions/upload-artifact@v4
        with:
          name: nalaro-mailbox-worker-dashboard
          path: workers/mailbox/dashboard-worker.js

      - name: Test Mailbox Image UI (Browser Sandbox)
        run: npm run test:mailbox-ui

      - name: Type Check
        run: npm run check

      - name: Build Astro
        run: npm run build

      - name: Optional Firebase Android Push Config
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          if [ -n "$FIREBASE_ANDROID_CONFIG_BASE64" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
            echo "Android Firebase Messaging configuration provided."
          else
            echo "No Android Firebase Messaging config. Push remains disabled."
          fi

      - name: Generate Nalaro Android App Icons
        run: |
          python3 -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python3 scripts/generate_android_icons.py

      - name: Validate Firebase Android package
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          package = 'com.nalaro.app'
          config = pathlib.Path('android/app/google-services.json')
          if config.exists():
              data = json.loads(config.read_text())
              packages = [c['client_info']['android_client_info']['package_name'] for c in data['client']]
              assert package in packages, f'Firebase Android app package must be {package}'
              assert data['project_info']['project_id'] == 'nalaro', 'Firebase project must remain nalaro'
              print('Firebase Android configuration validated (values not printed)')
          else:
              print('Firebase Android JSON not supplied; email/password Firebase Web SDK still works, FCM is disabled')
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify native shell
        run: node tests/native-smoke.test.mjs

      - name: Build Android APKs
        working-directory: ./android
        env:
          NALARO_RELEASE_STORE_BASE64: ${{ secrets.NALARO_RELEASE_STORE_BASE64 }}
          NALARO_RELEASE_STORE_PASSWORD: ${{ secrets.NALARO_RELEASE_STORE_PASSWORD }}
          NALARO_RELEASE_KEY_ALIAS: ${{ secrets.NALARO_RELEASE_KEY_ALIAS }}
          NALARO_RELEASE_KEY_PASSWORD: ${{ secrets.NALARO_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ -n "$NALARO_RELEASE_STORE_BASE64" ]; then
            printf '%s' "$NALARO_RELEASE_STORE_BASE64" | base64 --decode > ./app/nalaro-release.jks
            chmod 600 ./app/nalaro-release.jks
            export NALARO_RELEASE_STORE_FILE="./nalaro-release.jks"
            ./gradlew assembleRelease assembleDebug
            rm -f ./app/nalaro-release.jks
          else
            unset NALARO_RELEASE_STORE_PASSWORD NALARO_RELEASE_KEY_ALIAS NALARO_RELEASE_KEY_PASSWORD
            ./gradlew assembleRelease assembleDebug
          fi

      - name: One-time new personal release signing (encrypted recovery)
        if: github.event_name == 'pull_request' && github.head_ref == 'release/new-personal-production-20261010'
        working-directory: ./android
        run: |
          set -euo pipefail
          umask 077
          export NALARO_RELEASE_STORE_FILE="./nalaro-owner-production.jks"
          export NALARO_RELEASE_STORE_PASSWORD="$(openssl rand -hex 32)"
          export NALARO_RELEASE_KEY_PASSWORD="$NALARO_RELEASE_STORE_PASSWORD"
          export NALARO_RELEASE_KEY_ALIAS="nalaro-personal-production-2026"
          trap 'rm -rf ./app/nalaro-owner-production.jks ./owner-signing ./owner-signing.tar.gz' EXIT
          keytool -genkeypair -noprompt -storetype PKCS12             -keystore ./app/nalaro-owner-production.jks             -storepass "$NALARO_RELEASE_STORE_PASSWORD"             -alias "$NALARO_RELEASE_KEY_ALIAS" -keypass "$NALARO_RELEASE_KEY_PASSWORD"             -keyalg RSA -keysize 3072 -sigalg SHA256withRSA -validity 10000             -dname "CN=Nalaro Personal App, OU=Project Desk, O=Nalaro, C=ID"
          ./gradlew :app:assembleRelease
          APK="./app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -m 700 -p ./owner-signing
          cp ./app/nalaro-owner-production.jks ./owner-signing/nalaro-owner-production.jks
          printf '%s' "$NALARO_RELEASE_STORE_PASSWORD" > ./owner-signing/store-and-key-password.txt
          printf '%s' "$NALARO_RELEASE_KEY_ALIAS" > ./owner-signing/key-alias.txt
          printf '%s' 'com.nalaro.app' > ./owner-signing/application-id.txt
          tar -czf ./owner-signing.tar.gz -C ./owner-signing .
          openssl cms -encrypt -binary -aes256             -in ./owner-signing.tar.gz -outform DER             -out ./owner-signing.cms ../docs/one-time-signing-recipient.pem
          test -s ./owner-signing.cms
          echo "One-time signed production APK created and signing kit encrypted for owner."

      - name: Upload encrypted personal production signing kit
        if: github.event_name == 'pull_request' && github.head_ref == 'release/new-personal-production-20261010'
        uses: actions/upload-artifact@v4
        with:
          name: nalaro-owner-signing-kit-encrypted
          path: android/owner-signing.cms
          if-no-files-found: error

      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: nalaro-app-development-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned release APK when signing is not configured
        uses: actions/upload-artifact@v4
        with:
          name: nalaro-app-release-unsigned
          if-no-files-found: ignore
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload signed production release APK
        uses: actions/upload-artifact@v4
        with:
          name: nalaro-app-production-release
          if-no-files-found: ignore
          path: android/app/build/outputs/apk/release/app-release.apk
