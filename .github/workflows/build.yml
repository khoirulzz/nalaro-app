name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build Web and Mobile
    runs-on: ubuntu-latest
    env:
      PUBLIC_NATIVE_APP: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run check

      - name: Build Astro
        run: npm run build

      - name: Optional Firebase Android Push Config
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          if [ -n "$FIREBASE_ANDROID_CONFIG_BASE64" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
            echo "Android Firebase Messaging configuration provided."
          else
            echo "No Android Firebase Messaging config. Push remains disabled."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify native shell
        run: node tests/native-smoke.test.mjs

      - name: Build Android APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nalaro-app-development-debug-signed
          path: android/app/build/outputs/apk/release/app-release.apk
