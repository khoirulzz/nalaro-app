name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build Web and Mobile
    runs-on: ubuntu-latest
    env:
      PUBLIC_NATIVE_APP: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Order Contract
        run: node --experimental-strip-types tests/order-parity.test.mjs

      - name: Setup Browser Test
        run: npx playwright install --with-deps chromium

      - name: Firebase Emulator Dummy Order Test
        run: npx firebase emulators:exec --only firestore --project demo-nalaro-orders "node --experimental-strip-types tests/orders.test.mjs"

      - name: Validate Notify Worker Syntax
        run: node --check workers/notify/src/worker.js

      - name: Test Native Mail and Push Endpoints
        run: node tests/native-mail-push.test.mjs

      - name: Type Check
        run: npm run check

      - name: Build Astro
        run: npm run build

      - name: Optional Firebase Android Push Config
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          if [ -n "$FIREBASE_ANDROID_CONFIG_BASE64" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
            echo "Android Firebase Messaging configuration provided."
          else
            echo "No Android Firebase Messaging config. Push remains disabled."
          fi

      - name: Generate Nalaro Android App Icons
        run: |
          python3 -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python3 scripts/generate_android_icons.py

      - name: Validate Firebase Android package
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          package = 'com.nalaro.app'
          config = pathlib.Path('android/app/google-services.json')
          if config.exists():
              data = json.loads(config.read_text())
              packages = [c['client_info']['android_client_info']['package_name'] for c in data['client']]
              assert package in packages, f'Firebase Android app package must be {package}'
              assert data['project_info']['project_id'] == 'nalaro', 'Firebase project must remain nalaro'
              print('Firebase Android configuration validated (values not printed)')
          else:
              print('Firebase Android JSON not supplied; email/password Firebase Web SDK still works, FCM is disabled')
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify native shell
        run: node tests/native-smoke.test.mjs

      - name: Build Android APKs
        working-directory: ./android
        env:
          NALARO_RELEASE_STORE_BASE64: ${{ secrets.NALARO_RELEASE_STORE_BASE64 }}
          NALARO_RELEASE_STORE_PASSWORD: ${{ secrets.NALARO_RELEASE_STORE_PASSWORD }}
          NALARO_RELEASE_KEY_ALIAS: ${{ secrets.NALARO_RELEASE_KEY_ALIAS }}
          NALARO_RELEASE_KEY_PASSWORD: ${{ secrets.NALARO_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ -n "$NALARO_RELEASE_STORE_BASE64" ]; then
            printf '%s' "$NALARO_RELEASE_STORE_BASE64" | base64 --decode > ./app/nalaro-release.jks
            chmod 600 ./app/nalaro-release.jks
            export NALARO_RELEASE_STORE_FILE="./nalaro-release.jks"
            ./gradlew assembleRelease assembleDebug
            rm -f ./app/nalaro-release.jks
          else
            unset NALARO_RELEASE_STORE_PASSWORD NALARO_RELEASE_KEY_ALIAS NALARO_RELEASE_KEY_PASSWORD
            ./gradlew assembleRelease assembleDebug
          fi

      # One-time secure release bootstrap for this PR. The production signing
      # key is sealed to a public certificate before it becomes a CI artifact.
      # Remove this block after encrypted key recovery and upload the keystore
      # to GitHub Actions Secrets for all future releases.
      - name: Bootstrap owner-held production signing key
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/instant-mail-queue-release-20261009'
        working-directory: ./android
        run: |
          set -euo pipefail
          export NALARO_RELEASE_STORE_FILE="./nalaro-release.jks"
          export NALARO_RELEASE_STORE_PASSWORD="$(openssl rand -hex 32)"
          export NALARO_RELEASE_KEY_ALIAS="nalaro-production"
          export NALARO_RELEASE_KEY_PASSWORD="$NALARO_RELEASE_STORE_PASSWORD"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore ./app/nalaro-release.jks -storepass "$NALARO_RELEASE_STORE_PASSWORD" \
            -alias "$NALARO_RELEASE_KEY_ALIAS" -keypass "$NALARO_RELEASE_KEY_PASSWORD" \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=Nalaro Production, OU=Mobile, O=Nalaro, C=ID"
          ./gradlew :app:assembleRelease
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs ./app/build/outputs/apk/release/app-release.apk
          mkdir -m 700 -p ./signing-recovery
          cp ./app/nalaro-release.jks ./signing-recovery/nalaro-production.jks
          printf '%s\n' "$NALARO_RELEASE_STORE_PASSWORD" > ./signing-recovery/store-and-key-password.txt
          printf '%s\n' "$NALARO_RELEASE_KEY_ALIAS" > ./signing-recovery/key-alias.txt
          chmod 600 ./signing-recovery/*
          tar -czf ./signing-recovery.tar.gz -C ./signing-recovery .
          openssl cms -encrypt -binary -aes256 \
            -in ./signing-recovery.tar.gz -outform DER \
            -out ./signing-recovery.cms ../docs/release-bootstrap-recipient.pem
          rm -rf ./signing-recovery ./signing-recovery.tar.gz ./app/nalaro-release.jks
          echo "Verified production-signed APK and encrypted keystore recovery artifact."

      - name: Upload encrypted production signing kit
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/instant-mail-queue-release-20261009'
        uses: actions/upload-artifact@v4
        with:
          name: nalaro-production-signing-kit-encrypted
          path: android/signing-recovery.cms
          retention-days: 3

      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: nalaro-app-development-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned release APK when signing is not configured
        uses: actions/upload-artifact@v4
        with:
          name: nalaro-app-release-unsigned
          if-no-files-found: ignore
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload signed production release APK
        uses: actions/upload-artifact@v4
        with:
          name: nalaro-app-production-release
          if-no-files-found: ignore
          path: android/app/build/outputs/apk/release/app-release.apk
